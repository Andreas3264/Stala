# Build configuration
TEMP_DIR="build_tmp"
DIST_DIR="dist"

create_executable_from_asm() {
	nasm -f macho64 "$1".asm
	ld -macosx_version_min 11.0 -L /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib -lSystem -o "$1" "$1".o
	chmod +x "$1"
}

using_compiler_compile_to() {
	time ./"$1" "$2".stala -out "$3".asm
	create_executable_from_asm "$3"
}

bootstrap_using_compiler_compile_to() {
	echo "compiling $2 with $1"
	cd bootstrap/"$2"
	using_compiler_compile_to ../../"$TEMP_DIR"/compiler_"$1" compiler ../../"$TEMP_DIR"/compiler_"$2"
	cd ../..
}

self_compile_using_compiler_compile_to() {
	using_compiler_compile_to "$TEMP_DIR"/"$1" compiler/"$2" "$TEMP_DIR"/"$3"
}